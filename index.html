<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ViCut</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

    <div class="logo">
        ViCut
    </div>


    <button class="export">
        خروجی
    </button>


</header>




<main>


<section class="preview">


    <video id="video"></video>


    <div class="placeholder">
        ویدیو انتخاب کنید
    </div>


    <button id="chooseVideo">
        🎬 انتخاب ویدیو
    </button>


</section>






<section class="time-area">


    <div class="time-text">
        00:00 / 00:00
    </div>




    <div class="timeline">


        <div class="clip-track">


            <div class="clip-range"></div>


            <div class="handle left-handle"></div>


            <div class="handle right-handle"></div>


            <div class="play-marker"></div>


        </div>



    </div>



</section>








<section class="tools">


<div class="tool active">

    <div class="icon">
        ✂
    </div>

    <span>
        برش
    </span>

</div>




<div class="tool">

    <div class="icon">
        ♪
    </div>

    <span>
        صدا
    </span>

</div>




<div class="tool">

    <div class="icon">
        T
    </div>

    <span>
        متن
    </span>

</div>




<div class="tool">

    <div class="icon">
        ◐
    </div>

    <span>
        فیلتر
    </span>

</div>




<div class="tool">

    <div class="icon">
        ⚡
    </div>

    <span>
        سرعت
    </span>

</div>




<div class="tool">

    <div class="icon">
        ✦
    </div>

    <span>
        افکت
    </span>

</div>



</section>







<section class="panel">


<h3>
✂️ برش ویدیو
</h3>


<p>
شروع و پایان کلیپ را انتخاب کنید
</p>


</section>





<input 
id="file"
type="file"
accept="video/*"
hidden
>




</main>



<script src="app.js?v=5"></script>


</body>

</html>
