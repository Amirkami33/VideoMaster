<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ViCut</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="header">

    <div class="logo">
        ViCut
    </div>


    <button class="export">
        خروجی
    </button>

</header>




<main>



<section class="preview">


    <video id="video" controls></video>


    <div class="placeholder">
        انتخاب ویدیو
    </div>


    <button id="chooseVideo">
        🎬 انتخاب ویدیو
    </button>


</section>





<section class="time-area">


    <div class="time-text">

        00:00 / 00:00

    </div>


    <div class="timeline">


        <div class="line"></div>


        <div class="marker"></div>


    </div>



</section>







<section class="tools">


<div class="tool active">

    <div class="icon">
        ✂
    </div>

    <span>
        برش
    </span>

</div>



<div class="tool">

    <div class="icon">
        ♪
    </div>

    <span>
        صدا
    </span>

</div>



<div class="tool">

    <div class="icon">
        T
    </div>

    <span>
        متن
    </span>

</div>




<div class="tool">

    <div class="icon">
        ◐
    </div>

    <span>
        فیلتر
    </span>

</div>




<div class="tool">

    <div class="icon">
        ⚡
    </div>

    <span>
        سرعت
    </span>

</div>




<div class="tool">

    <div class="icon">
        ✦
    </div>

    <span>
        افکت
    </span>

</div>



</section>







<section class="panel">


<h3>
✂️ برش ویدیو
</h3>


<p>
نقطه شروع و پایان کلیپ را انتخاب کنید
</p>


</section>






<input 
type="file"
id="file"
accept="video/*"
hidden
>



</main>



<script src="app.js"></script>


</body>

</html>
