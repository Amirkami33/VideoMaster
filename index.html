<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VideoMaster</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="app-header">

    <div class="logo">
        🥇 VideoMaster
    </div>

    <button class="export-btn">
        خروجی
    </button>

</header>



<main class="editor">


<!-- Video Preview -->

<section class="preview-area">

    <video id="videoPlayer" controls></video>

    <div class="empty-text">
        ابتدا یک ویدیو انتخاب کنید
    </div>

</section>



<!-- Timeline -->

<section class="timeline">

    <div class="timeline-track">
        <div class="timeline-progress"></div>
    </div>

</section>




<!-- Tools -->

<section class="tools">


<button class="tool" data-tool="cut">
    ✂️
    <span>برش</span>
</button>


<button class="tool" data-tool="audio">
    🎵
    <span>صدا</span>
</button>


<button class="tool" data-tool="text">
    T
    <span>متن</span>
</button>


<button class="tool" data-tool="filter">
    🎨
    <span>فیلتر</span>
</button>


<button class="tool" data-tool="speed">
    ⚡
    <span>سرعت</span>
</button>


<button class="tool" data-tool="rotate">
    🔄
    <span>چرخش</span>
</button>


<button class="tool" data-tool="ratio">
    📐
    <span>اندازه</span>
</button>


<button class="tool" data-tool="effect">
    ✨
    <span>افکت</span>
</button>


<button class="tool" data-tool="sticker">
    😊
    <span>استیکر</span>
</button>


</section>





<!-- Tool Settings -->

<section class="settings-panel">

<h3 id="toolTitle">
تنظیمات ابزار
</h3>


<div id="toolContent">

یک ابزار را انتخاب کنید

</div>


</section>




</main>




<input 
type="file"
id="videoInput"
accept="video/*"
hidden
>


<script src="app.js"></script>

</body>

</html>
