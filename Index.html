<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VideoMaster</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="app-header">

    <div class="logo">
        VideoMaster
    </div>

    <button class="export-btn">
        خروجی
    </button>

</header>



<main class="editor">


<section class="preview-area">

    <video id="videoPlayer" controls></video>

    <div class="empty-text">
        ویدیو را انتخاب کنید
    </div>

</section>



<section class="timeline">

    <div class="timeline-line"></div>

</section>



<section class="tools">


<div class="tool">
    ✂️
    <span>برش</span>
</div>


<div class="tool">
    🎵
    <span>صدا</span>
</div>


<div class="tool">
    T
    <span>متن</span>
</div>


<div class="tool">
    🎨
    <span>فیلتر</span>
</div>


<div class="tool">
    ⚡
    <span>سرعت</span>
</div>


<div class="tool">
    📐
    <span>اندازه</span>
</div>


<div class="tool">
    ✨
    <span>افکت</span>
</div>


<div class="tool">
    😊
    <span>استیکر</span>
</div>


</section>



<section class="settings-panel">

    <h3>
        تنظیمات ابزار
    </h3>

    <p>
        یک ابزار را انتخاب کنید
    </p>

</section>


</main>


<input 
type="file"
id="videoInput"
accept="video/*"
hidden
>


<script src="app.js"></script>

</body>

</html>
